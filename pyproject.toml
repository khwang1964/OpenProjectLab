[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openprojectlab"
version = "1.0.0"
description = "OpenProjectLab education content generator framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Jacky Wang" },
]
keywords = [
    "education",
    "generator",
    "course",
    "teaching",
    "open-courseware",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.12",
    "twine>=6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

[project.scripts]
opl = "generator.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"generator.resources" = [
    "templates/**/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["generator", "generator.*"]
exclude = [
    "tests",
    "tests.*",
    "docs",
    "docs.*",
    "ai",
    "ai.*",
    "config",
    "config.*",
    "courses",
    "courses.*",
    "plugins",
    "plugins.*",
    "website",
    "website.*",
    "templates",
    "templates.*",
    "examples",
    "examples.*",
    "scripts",
    "scripts.*",
]
namespaces = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ai_live: tests requiring a real AI provider and external credentials",
]
addopts = [
    "-m",
    "not ai_live",
    "-v",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=generator",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["generator"]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 67
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "D",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["generator"]
exclude = [
    "^build/",
    "^dist/",
]
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_unreachable = true

dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]
