name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev,docs]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
      - run: pytest --cov
      - run: mkdocs build
