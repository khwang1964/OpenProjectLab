name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify and publish, for example v1.0.0rc1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify release identity
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          from generator.release.identity import (
              ReleaseIdentity,
              expected_release_tag,
              read_canonical_version,
              validate_release_identity,
          )

          version = read_canonical_version(Path("pyproject.toml"))
          expected_tag = expected_release_tag(version)
          requested_tag = "${{ inputs.tag }}"
          if requested_tag != expected_tag:
              raise SystemExit(
                  f"requested tag {requested_tag!r} does not match "
                  f"canonical tag {expected_tag!r}"
              )

          commit_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          tag_target_sha = subprocess.check_output(
              ["git", "rev-list", "-n", "1", requested_tag],
              text=True,
          ).strip()

          identity = ReleaseIdentity(
              version=version,
              commit_sha=commit_sha,
              tag=requested_tag,
          )
          validate_release_identity(
              identity,
              tag_target_sha=tag_target_sha,
          )
          print(f"release_version={version}")
          print(f"release_tag={requested_tag}")
          print(f"release_sha={commit_sha}")
          PY

      - name: Clean build outputs
        run: rm -rf build dist

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify release artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          from generator.release.artifacts import (
              ReleaseArtifactSet,
              enumerate_release_artifacts,
              verify_release_artifact_set,
          )
          from generator.release.identity import read_canonical_version

          version = read_canonical_version(Path("pyproject.toml"))
          artifacts = enumerate_release_artifacts(Path("dist"))
          artifact_set = ReleaseArtifactSet(artifacts=artifacts)
          verify_release_artifact_set(
              artifact_set,
              expected_project="openprojectlab",
              expected_version=version,
              inspect_wheel_metadata=True,
          )
          PY

      - name: Run release contract tests
        run: python -m pytest tests/release -v --no-cov

      - name: Verify wheel-backed installed-user paths
        shell: bash
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          from generator.release.artifacts import select_current_wheel
          from generator.release.identity import read_canonical_version

          version = read_canonical_version(Path("pyproject.toml"))
          wheel = select_current_wheel(
              Path("dist"),
              expected_project="openprojectlab",
              expected_version=version,
          )
          print(wheel)
          PY
          )"
          export OPL_TEST_WHEEL="$wheel"
          test -f "$OPL_TEST_WHEEL"
          python -m pytest tests/packaging tests/documentation/test_first_15_minutes.py -v --no-cov

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish draft GitHub Release
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: release-assets

      - name: Re-verify downloaded checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          prerelease: ${{ contains(inputs.tag, 'rc') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
