name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: |
          python -m pip install -e .
          python -m pip install pre-commit pytest pytest-cov ruff

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run tests
        run: python -m pytest
  packaging:
    name: Packaging artifact verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install packaging verification tools
        run: |
          python -m pip install .
          python -m pip install build twine pytest pytest-cov

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Resolve built wheel
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)

          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            printf '%s\n' "${wheels[@]}"
            exit 1
          fi

          wheel_path="$(realpath "${wheels[0]}")"
          echo "wheel=$wheel_path" >> "$GITHUB_OUTPUT"
          echo "Built wheel: $wheel_path"

      - name: Run packaging artifact tests
        env:
          OPL_TEST_WHEEL: ${{ steps.wheel.outputs.wheel }}
        run: |
          python -m pytest tests/packaging -v --no-cov

      - name: Run installed-user documentation smoke tests
        env:
          OPL_TEST_WHEEL: ${{ steps.wheel.outputs.wheel }}
        run: |
          python -m pytest tests/documentation/test_first_15_minutes.py -v --no-cov
