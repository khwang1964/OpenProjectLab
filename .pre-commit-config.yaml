# -----------------------------------------------------------------------------
# OpenProjectLab
# Pre-Commit Configuration
# -----------------------------------------------------------------------------

minimum_pre_commit_version: "4.0.0"

default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # Basic repository hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---------------------------------------------------------------------------
  # Ruff (Lint + Formatter)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix

      - id: ruff-format

  # ---------------------------------------------------------------------------
  # Pytest
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -m pytest -q
        language: system
        pass_filenames: false
        always_run: true

  # ---------------------------------------------------------------------------
  # Optional (enable after MkDocs is introduced)
  # ---------------------------------------------------------------------------
  #
  # - repo: local
  #   hooks:
  #     - id: mkdocs
  #       name: Build documentation
  #       entry: mkdocs build --strict
  #       language: system
  #       pass_filenames: false
