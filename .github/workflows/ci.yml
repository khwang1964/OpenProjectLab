name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development tools
        run: |
          python -m pip install -e .
          python -m pip install pre-commit pytest pytest-cov ruff

      - name: Audit repository structure
        run: python scripts/audit_repository.py

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run Ruff
        run: ruff check .

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=generator \
            --cov-report=term-missing \
            --cov-report=xml
